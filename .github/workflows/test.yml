name: Test build
on:
  push:
  pull_request:
    types: [opened, reopened, synchronize]
jobs:
  test-job:
    name: Test job.
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
      actions: write
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}

    steps:
      - uses: actions/checkout@11bd719899917474d19c331e618be0c4ad6e6a54 # v4.4.0
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5cb # v4.5.0
        with:
          node-version: 22
      - run: make coverage
      - uses: k1LoW/octocov-action@b3b6ee60482a667950f87553abf1df63217235d9 # v1.5.1
        with:
          config: .octocov.yml
      - run: make dist/index.html
