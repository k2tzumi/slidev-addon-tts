name: Upload Release assets and npm publish.
on:
  # dispatch from tagpr.yml workflow
  workflow_dispatch:
    inputs:
      tag:
        type: string
        required: false
        default: 'v.0.0.0'
        description: 'Specify release tag'
jobs:
  npm-publish-job:
    name: Upload Release assets and npm publish.
    runs-on: ubuntu-24.04
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    # Sets permissions of the GITHUB_TOKEN to allow deployment
    permissions:
      contents: write # Upload Release assets
      id-token: write
      pages: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@11bd719899917474d19c331e618be0c4ad6e6a54 # v4.4.0
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5cb # v4.5.0
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
          scope: '@katzumi'
      - name: Install dependencies
        run: npm ci
      - name: Fix package.json version (strip v-prefix added by tagpr)
        run: npm pkg fix
      - run: npm pack
      - name: Get assets file name
        id: get-assets-file-name
        run: |
          assets=$(npm pack --json | jq -r '.[0].filename' | sed 's/^$//')
          echo "packFile=${assets}" >> $GITHUB_OUTPUT
      - name: Upload Release Asset
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.2.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const path = require('path');
            const release = await github.rest.repos.getReleaseByTag({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag: context.payload.inputs.tag
            });
            const packFile = '${{ steps.get-assets-file-name.outputs.packFile }}';
            const filePath = path.join(path.resolve(process.env.GITHUB_WORKSPACE), packFile);
            const fileContent = fs.readFileSync(filePath);
            await github.rest.repos.uploadReleaseAsset({
              url: release.data.upload_url,
              headers: {
                'content-type': 'application/octet-stream',
                'content-length': fileContent.length,
              },
              name: packFile,
              data: fileContent,
            });
      - name: Verify npm authentication
        run: npm whoami
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: npm publish
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        continue-on-error: true
      - uses: FedericoCarboni/setup-ffmpeg@36c6454b5a2348e7794ba2d82a21506605921e3d # v3
        with:
          ffmpeg-version: release
          github-token: ${{ github.token }}
      - name: Generate TTS audio (AAC + manifest.json)
        if: ${{ env.VITE_CLOUD_TTS_API_KEY != '' }}
        env:
          VITE_CLOUD_TTS_API_KEY: ${{ secrets.CLOUD_TTS_API_KEY }}
        run: npm run build:tts
      - name: Enable pre-generated TTS mode for publishing
        run: |
          sed -i 's/usePregenerated: false/usePregenerated: true/' example.md
      - run: npm run publish
        env:
          REPOSITORY: ${{ github.event.repository.name }}
      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Upload artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          # Upload entire repository
          path: './docs/.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
