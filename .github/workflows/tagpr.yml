name: tagpr
on:
  push:
    branches:
      - main

jobs:
  tagpr:
    runs-on: ubuntu-latest
    outputs:
      tagpr-tag: ${{ steps.tagpr.outputs.tag }}
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check out source code
        uses: actions/checkout@11bd719899917474d19c331e618be0c4ad6e6a54 # v4.4.0

      - id: tagpr
        name: Run tagpr
        uses: Songmu/tagpr@9bbb945b2fb025126186661e27d55485e3fc6df6 # v1.18.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Trigger release Workflow
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.2.0
        continue-on-error: true
        if: steps.tagpr.outputs.tag != ''
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            let refs = '${{ fromJson(steps.tagpr.outputs.pull_request).head.ref }}'

            github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'release.yml',
              ref: refs,
              inputs: {
                tag: '${{ steps.tagpr.outputs.tag }}'
              },
            })
